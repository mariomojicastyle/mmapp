<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" style="background:#F8FAFC; font-family:'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Filtros de sombra profesional sobria -->
    <filter id="shadow-card" x="-4%" y="-2%" width="108%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="shadow-badge" x="-10%" y="-15%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0088AA" flood-opacity="0.18"/>
    </filter>

    <!-- Gradientes sutiles de tarjeta -->
    <linearGradient id="grad-escritorio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5F5"/>
    </linearGradient>
    <linearGradient id="grad-3bf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDFD"/>
    </linearGradient>
    <linearGradient id="grad-accent-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="grad-accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088AA"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Grilla técnica de fondo Tech Ethos (Editable en Inkscape) -->
  <g id="grilla-fondo" stroke="#E2E8F0" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80" x2="1440" y2="80"/>
    <line x1="0" y1="160" x2="1440" y2="160"/>
    <line x1="0" y1="240" x2="1440" y2="240"/>
    <line x1="0" y1="320" x2="1440" y2="320"/>
    <line x1="0" y1="400" x2="1440" y2="400"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="560" x2="1440" y2="560"/>
    <line x1="0" y1="640" x2="1440" y2="640"/>
    <line x1="0" y1="720" x2="1440" y2="720"/>
    <line x1="0" y1="800" x2="1440" y2="800"/>
    <line x1="0" y1="880" x2="1440" y2="880"/>

    <line x1="120" y1="0" x2="120" y2="960"/>
    <line x1="240" y1="0" x2="240" y2="960"/>
    <line x1="360" y1="0" x2="360" y2="960"/>
    <line x1="480" y1="0" x2="480" y2="960"/>
    <line x1="600" y1="0" x2="600" y2="960"/>
    <line x1="720" y1="0" x2="720" y2="960" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="840" y1="0" x2="840" y2="960"/>
    <line x1="960" y1="0" x2="960" y2="960"/>
    <line x1="1080" y1="0" x2="1080" y2="960"/>
    <line x1="1200" y1="0" x2="1200" y2="960"/>
    <line x1="1320" y1="0" x2="1320" y2="960"/>
  </g>

  <!-- ==================== HEADER ==================== -->
  <g id="header" transform="translate(60, 40)">
    <!-- Cápsula de Categoría Superior -->
    <rect x="0" y="0" width="370" height="30" rx="9999" fill="#0088AA" fill-opacity="0.1" stroke="#0088AA" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="5" fill="#0088AA"/>
    <text x="30" y="19" font-size="11" font-weight="700" fill="#0088AA" letter-spacing="1.2">INTELIGENCIA INDUSTRIAL &amp; RETORNO DE INVERSIÓN (ROI)</text>

    <!-- Marca Oficial 3dBimFab en Esquina Superior Derecha -->
    <g transform="translate(1080, -5)">
      <rect x="0" y="0" width="36" height="36" rx="6" fill="#BB0F0F"/>
      <text x="6" y="25" font-size="17" font-weight="800" fill="#FFFFFF" font-family="'Prompt', sans-serif">3BF</text>
      <text x="44" y="22" font-size="20" font-weight="700" fill="#0F172A">3dBimFab</text>
      <text x="45" y="32" font-size="8" font-weight="600" fill="#64748B" letter-spacing="0.8">POWERED BY MARIO MOJICA</text>
    </g>

    <!-- Título Principal Disruptivo -->
    <text x="0" y="65" font-size="32" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      La Trampa de los 3 Minutos: Software Local vs 3dBimFab Cloud
    </text>

    <!-- Bajada / Subtítulo Persuasivo -->
    <text x="0" y="94" font-size="15" font-weight="500" fill="#475569">
      En manufactura, <tspan fill="#DC2626" font-weight="700">"esperar 3 minutos"</tspan> de cálculo es una ilusión: es la ventana donde el operario toma el celular y el taller pierde 20 minutos de productividad.
    </text>
  </g>

  <!-- ==================== COLUMNA IZQUIERDA: SOFTWARE DE ESCRITORIO ==================== -->
  <g id="col-escritorio" transform="translate(60, 160)">
    <!-- Contenedor Tarjeta -->
    <rect x="0" y="0" width="630" height="630" rx="24" fill="url(#grad-escritorio)" stroke="#FECDD3" stroke-width="1.8" filter="url(#shadow-card)"/>

    <!-- Cabecera de la Tarjeta Izquierda -->
    <g transform="translate(32, 32)">
      <!-- Cápsula Estado -->
      <rect x="0" y="0" width="260" height="28" rx="9999" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1"/>
      <text x="16" y="18" font-size="11" font-weight="700" fill="#E11D48" letter-spacing="0.5">SOFTWARE DE ESCRITORIO (MONOLÍTICO)</text>

      <text x="0" y="60" font-size="22" font-weight="800" fill="#881337">El Pozo de la Procrastinación Local</text>
      <text x="0" y="80" font-size="13" font-weight="500" fill="#64748B">MaxCut / Deepnest / Software CNC Legacy en Windows</text>

      <!-- Bloque Métrica de Impacto -->
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="566" height="88" rx="16" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="4 2"/>
        <text x="24" y="34" font-size="12" font-weight="700" fill="#9F1239" letter-spacing="1">TIEMPO REAL CONSUMIDO POR LOTE:</text>
        <text x="24" y="68" font-size="34" font-weight="900" fill="#E11D48">3 a 5 min <tspan font-size="20" font-weight="600" fill="#64748B">cálculo</tspan> → 20 min <tspan font-size="18" font-weight="700" fill="#9F1239">perdidos</tspan></text>
      </g>

      <!-- Secuencia de Fricción Psicológica (Paso a Paso) -->
      <g transform="translate(0, 210)">
        <text x="0" y="0" font-size="12" font-weight="800" fill="#0F172A" letter-spacing="1">LA REACCIÓN EN CADENA DEL TIEMPO MUERTO:</text>

        <!-- Paso 1 -->
        <g transform="translate(0, 15)">
          <circle cx="16" cy="18" r="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
          <text x="12" y="23" font-size="12" font-weight="800" fill="#DC2626">1</text>
          <text x="42" y="16" font-size="13" font-weight="700" fill="#1E293B">Fricción de Exportación Manual (CSV / DXF)</text>
          <text x="42" y="32" font-size="11.5" font-weight="500" fill="#64748B">Exportar archivos, abrir programa pesado, configurar tolerancias a mano.</text>
        </g>

        <!-- Paso 2 -->
        <g transform="translate(0, 65)">
          <circle cx="16" cy="18" r="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
          <text x="12" y="23" font-size="12" font-weight="800" fill="#DC2626">2</text>
          <text x="42" y="16" font-size="13" font-weight="700" fill="#1E293B">Espera Pasiva: CPU al 100% (3 a 5 minutos)</text>
          <text x="42" y="32" font-size="11.5" font-weight="500" fill="#64748B">La computadora se congela iterando algoritmos lentos monohilo.</text>
        </g>

        <!-- Paso 3: El detonante de la procrastinación -->
        <g transform="translate(0, 115)">
          <circle cx="16" cy="18" r="14" fill="#F43F5E" stroke="#BE123C" stroke-width="1.5"/>
          <text x="12" y="23" font-size="12" font-weight="800" fill="#FFFFFF">3</text>
          <text x="42" y="16" font-size="13" font-weight="800" fill="#BE123C">La Brecha del Celular (Punto Crítico de Pérdida)</text>
          <text x="42" y="32" font-size="11.5" font-weight="500" fill="#64748B">El operario no espera mirando la pantalla: abre WhatsApp, reels o conversa.</text>
        </g>

        <!-- Paso 4 -->
        <g transform="translate(0, 165)">
          <circle cx="16" cy="18" r="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
          <text x="12" y="23" font-size="12" font-weight="800" fill="#DC2626">4</text>
          <text x="42" y="16" font-size="13" font-weight="700" fill="#1E293B">Retorno de Enfoque Tardío (+15 minutos)</text>
          <text x="42" y="32" font-size="11.5" font-weight="500" fill="#64748B">El cálculo terminó hace rato, pero la máquina sigue apagada y sin cortar.</text>
        </g>
      </g>

      <!-- Cuadrícula de Desventajas Técnicas -->
      <g transform="translate(0, 440)">
        <rect x="0" y="0" width="273" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="16" y="24" font-size="11" font-weight="700" fill="#DC2626">DESCONEXIÓN CAD/3D</text>
        <text x="16" y="44" font-size="12" font-weight="600" fill="#1E293B">Cero paramétrico</text>
        <text x="16" y="64" font-size="11" font-weight="400" fill="#64748B">Si cambia una cota o espesor,</text>
        <text x="16" y="80" font-size="11" font-weight="400" fill="#64748B">se repite todo el proceso manual.</text>

        <rect x="293" y="0" width="273" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="16" y="24" font-size="11" font-weight="700" fill="#DC2626">MERMA ESTÁTICA ELEVADA</text>
        <text x="16" y="44" font-size="12" font-weight="600" fill="#1E293B">16.46% de Desperdicio</text>
        <text x="16" y="64" font-size="11" font-weight="400" fill="#64748B">Requiere 78 tableros (MaxCut)</text>
        <text x="16" y="80" font-size="11" font-weight="400" fill="#64748B">para el lote de 50 cómodas.</text>
      </g>
    </g>
  </g>

  <!-- ==================== CÁPSULA CENTRAL VERSUS ==================== -->
  <g id="versus-badge" transform="translate(700, 440)" filter="url(#shadow-badge)">
    <circle cx="20" cy="20" r="26" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
    <text x="10" y="27" font-size="16" font-weight="900" fill="#38BDF8" letter-spacing="1">VS</text>
  </g>

  <!-- ==================== COLUMNA DERECHA: 3dBimFab CLOUD ==================== -->
  <g id="col-3dbimfab" transform="translate(750, 160)">
    <!-- Contenedor Tarjeta -->
    <rect x="0" y="0" width="630" height="630" rx="24" fill="url(#grad-3bf)" stroke="#67E8F9" stroke-width="2.2" filter="url(#shadow-glow)"/>

    <!-- Cabecera de la Tarjeta Derecha -->
    <g transform="translate(32, 32)">
      <!-- Cápsula Estado -->
      <rect x="0" y="0" width="260" height="28" rx="9999" fill="#0088AA" stroke="#0891B2" stroke-width="1"/>
      <text x="16" y="18" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">3dBimFab (CLOUD PARAMÉTRICO)</text>

      <text x="0" y="60" font-size="22" font-weight="800" fill="#0E7490">Flujo Continuo Cero Fricción</text>
      <text x="0" y="80" font-size="13" font-weight="500" fill="#0284C7">Motor Metaheurístico Strip-Packing Multi-Semilla en Vivo</text>

      <!-- Bloque Métrica de Impacto -->
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="566" height="88" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.4"/>
        <text x="24" y="34" font-size="12" font-weight="700" fill="#0891B2" letter-spacing="1">TIEMPO DE CÁLCULO (2,650 PIEZAS / 50 MUEBLES):</text>
        <text x="24" y="68" font-size="34" font-weight="900" fill="#0088AA">283 ms <tspan font-size="20" font-weight="600" fill="#0284C7">(0.28 seg)</tspan> → 0 min <tspan font-size="18" font-weight="700" fill="#059669">espera</tspan></text>
      </g>

      <!-- Secuencia de Ventaja Competitiva -->
      <g transform="translate(0, 210)">
        <text x="0" y="0" font-size="12" font-weight="800" fill="#0F172A" letter-spacing="1">VELOCIDAD QUE BLOQUEA LA PROCRASTINACIÓN:</text>

        <!-- Paso 1 -->
        <g transform="translate(0, 15)">
          <circle cx="16" cy="18" r="14" fill="#CFFAFE" stroke="#0088AA" stroke-width="1.5"/>
          <text x="12" y="23" font-size="12" font-weight="800" fill="#0088AA">1</text>
          <text x="42" y="16" font-size="13" font-weight="700" fill="#0F172A">Conexión Viva con el Gemelo Digital 3D</text>
          <text x="42" y="32" font-size="11.5" font-weight="500" fill="#475569">Las piezas se extraen instantáneamente de Grasshopper / DfMA sin digitar.</text>
        </g>

        <!-- Paso 2 -->
        <g transform="translate(0, 65)">
          <circle cx="16" cy="18" r="14" fill="#CFFAFE" stroke="#0088AA" stroke-width="1.5"/>
          <text x="12" y="23" font-size="12" font-weight="800" fill="#0088AA">2</text>
          <text x="42" y="16" font-size="13" font-weight="700" fill="#0F172A">Ejecución Sub-Segundo (Menos de un Parpadeo)</text>
          <text x="42" y="32" font-size="11.5" font-weight="500" fill="#475569">148 iteraciones estocásticas resueltas en 283.8 ms dentro del navegador.</text>
        </g>

        <!-- Paso 3: El secreto productivo -->
        <g transform="translate(0, 115)">
          <circle cx="16" cy="18" r="14" fill="#0088AA" stroke="#0E7490" stroke-width="1.5"/>
          <text x="12" y="23" font-size="12" font-weight="800" fill="#FFFFFF">3</text>
          <text x="42" y="16" font-size="13" font-weight="800" fill="#0891B2">Cero Ventana de Distracción para el Operario</text>
          <text x="42" y="32" font-size="11.5" font-weight="500" fill="#475569">No da tiempo de sacar el teléfono ni de perder el hilo: el plano ya está en pantalla.</text>
        </g>

        <!-- Paso 4 -->
        <g transform="translate(0, 165)">
          <circle cx="16" cy="18" r="14" fill="#CFFAFE" stroke="#0088AA" stroke-width="1.5"/>
          <text x="12" y="23" font-size="12" font-weight="800" fill="#0088AA">4</text>
          <text x="42" y="16" font-size="13" font-weight="700" fill="#0F172A">Acción Inmediata en Planta: Ficha PDF y CNC</text>
          <text x="42" y="32" font-size="11.5" font-weight="500" fill="#475569">Esquemas acotados, DXF para Deepnest/CNC y ficha de taller en 1 clic.</text>
        </g>
      </g>

      <!-- Cuadrícula de Ventajas Técnicas -->
      <g transform="translate(0, 440)">
        <rect x="0" y="0" width="273" height="110" rx="12" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
        <text x="16" y="24" font-size="11" font-weight="700" fill="#0088AA">SINCRONIZACIÓN TOTAL 3D</text>
        <text x="16" y="44" font-size="12" font-weight="600" fill="#0F172A">100% Paramétrico en la Nube</text>
        <text x="16" y="64" font-size="11" font-weight="400" fill="#475569">Cambia el ancho del mueble y</text>
        <text x="16" y="80" font-size="11" font-weight="400" fill="#475569">el nesting se reajusta al instante.</text>

        <rect x="293" y="0" width="273" height="110" rx="12" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
        <text x="16" y="24" font-size="11" font-weight="700" fill="#059669">MÁXIMO APROVECHAMIENTO</text>
        <text x="16" y="44" font-size="12" font-weight="600" fill="#059669">12.9% Merma (75 Tableros)</text>
        <text x="16" y="64" font-size="11" font-weight="400" fill="#475569">Ahorro de 3 tableros por lote</text>
        <text x="16" y="80" font-size="11" font-weight="400" fill="#475569">frente a MaxCut tradicional.</text>
      </g>
    </g>
  </g>

  <!-- ==================== BANNER INFERIOR DE CONCLUSIÓN COMERCIAL ==================== -->
  <g id="footer-banner" transform="translate(60, 815)">
    <rect x="0" y="0" width="1320" height="105" rx="18" fill="#0F172A" filter="url(#shadow-card)"/>

    <g transform="translate(36, 26)">
      <!-- Columna 1: El Diagnóstico -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.2">EL IMPACTO FINANCIERO ANUAL:</text>
        <text x="0" y="42" font-size="20" font-weight="800" fill="#FFFFFF">La Velocidad No Es Lujo, Es Disciplina</text>
        <text x="0" y="60" font-size="12" font-weight="400" fill="#94A3B8">Eliminar la ventana de espera erradica el tiempo ocioso y la fuga de atención.</text>
      </g>

      <!-- Columna 2: KPI Madera Ahorrada -->
      <g transform="translate(620, 5)">
        <rect x="0" y="0" width="160" height="48" rx="9999" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="20" y="22" font-size="10" font-weight="700" fill="#38BDF8">TABLEROS SALVADOS</text>
        <text x="20" y="40" font-size="18" font-weight="900" fill="#34D399">+3 Tableros <tspan font-size="11" font-weight="500" fill="#94A3B8">/ Lote</tspan></text>
      </g>

      <!-- Columna 3: KPI Tiempo Recuperado -->
      <g transform="translate(800, 5)">
        <rect x="0" y="0" width="180" height="48" rx="9999" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="20" y="22" font-size="10" font-weight="700" fill="#38BDF8">TIEMPO MUERTO EVITADO</text>
        <text x="20" y="40" font-size="18" font-weight="900" fill="#38BDF8">~40 min / día <tspan font-size="11" font-weight="500" fill="#94A3B8">máquina</tspan></text>
      </g>

      <!-- Columna 4: Botón de Llamada a la Acción B2B -->
      <g transform="translate(1010, 5)">
        <rect x="0" y="0" width="230" height="48" rx="9999" fill="#0088AA" stroke="#38BDF8" stroke-width="1"/>
        <text x="28" y="29" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">OPTIMIZAR CON 3dBimFab ➔</text>
      </g>
    </g>
  </g>
</svg>
