[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/proyectos/guardar-camara"
  to = "/.netlify/functions/guardar-camara"
  status = 200
  force = true

[build.environment]
  VITE_SUPABASE_URL = "https://dezaisaunoumhqpssols.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_HyhWSanS2mhByF476p_EzA_6oq2bQOT"

[[headers]]
  for = "/draco/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/draco/*"
  to = "/draco/:splat"
  status = 200

[[redirects]]
  from = "/assets/herrajes_compartidos/*"
  to = "https://dezaisaunoumhqpssols.supabase.co/storage/v1/object/public/insumos_manuales/_herrajes_compartidos/:splat"
  status = 200

[[redirects]]
  from = "/:manualId/herrajes/*"
  to = "https://dezaisaunoumhqpssols.supabase.co/storage/v1/object/public/insumos_manuales/_herrajes_compartidos/:splat"
  status = 200

[[redirects]]
  from = "/:manualId/:file"
  to = "https://dezaisaunoumhqpssols.supabase.co/storage/v1/object/public/insumos_manuales/:manualId/:file"
  status = 200

[[redirects]]
  from = "/:manualId/:category/*"
  to = "https://dezaisaunoumhqpssols.supabase.co/storage/v1/object/public/insumos_manuales/:manualId/:category/:splat"
  status = 200



