    <!-- Consola Móvil DevTools (Eruda) gobernada dinámicamente -->
    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const debugParam = params.get("debug");
        const erudaParam = params.get("eruda");
        let isDebug = debugParam === "on" || debugParam === "true" || erudaParam === "on" || erudaParam === "true" || localStorage.getItem("debugConsole") === "on";

        function initEruda() {
          if (window.__erudaLoaded) {
            if (typeof eruda !== "undefined") {
              if (window.__erudaVisible) {
                eruda.hide();
                window.__erudaVisible = false;
              } else {
                eruda.show();
                window.__erudaVisible = true;
              }
            }
            return;
          }
          const s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/eruda";
          s.onload = function() {
            window.__erudaLoaded = true;
            window.__erudaVisible = true;
            if (typeof eruda !== "undefined") {
              eruda.init();
              console.log("[Eruda] Consola de depuración móvil iniciada.");
            }
          };
          document.head.appendChild(s);
        }

        if (isDebug) {
          initEruda();
        }

        // Atajo: Triple toque / clic en la esquina superior izquierda (x < 120, y < 120)
        let tapCount = 0;
        let tapTimer = null;
        window.addEventListener("pointerdown", function(e) {
          if (e.clientX < 120 && e.clientY < 120) {
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount >= 3) {
              tapCount = 0;
              initEruda();
            } else {
              tapTimer = setTimeout(function() { tapCount = 0; }, 600);
            }
          }
        });
      })();
    </script>
