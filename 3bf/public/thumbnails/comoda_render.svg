<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cajonWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="dropShadowCajon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="20" fill="#1E232A" />
  <circle cx="120" cy="120" r="105" fill="#15191E" stroke="#2D333B" stroke-width="1.5" />
  <ellipse cx="120" cy="190" rx="70" ry="16" fill="#0D1013" opacity="0.7" />

  <!-- Cajonera 3D Isométrica -->
  <g transform="translate(120, 110) scale(0.9)" filter="url(#dropShadowCajon)">
    <!-- Cuerpo Superior -->
    <polygon points="-50,-35 10,-60 60,-35 0,-10" fill="#9CA3AF" stroke="#D1D5DB" stroke-width="1"/>
    <!-- Costado Izquierdo -->
    <polygon points="-50,-35 0,-10 0,60 -50,35" fill="#4B5563" stroke="#374151" stroke-width="1"/>
    <!-- Frente Derecha con 3 Gavetas -->
    <polygon points="0,-10 60,-35 60,35 0,60" fill="#6B7280" stroke="#4B5563" stroke-width="1"/>
    
    <!-- Líneas de Gavetas -->
    <line x1="0" y1="12" x2="60" y2="-13" stroke="#1F2937" stroke-width="2"/>
    <line x1="0" y1="36" x2="60" y2="11" stroke="#1F2937" stroke-width="2"/>
    
    <!-- Tiradores de Gavetas -->
    <line x1="25" y1="-2" x2="35" y2="-6" stroke="#00C9A7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="22" x2="35" y2="18" stroke="#00C9A7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="46" x2="35" y2="42" stroke="#00C9A7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
