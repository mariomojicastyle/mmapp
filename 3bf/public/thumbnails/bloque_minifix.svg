<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMinifix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="metalCam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgMinifix)" rx="16"/>

  <!-- Panel Cutout (Tablero MDF) -->
  <rect x="50" y="70" width="160" height="160" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="100" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#64748b">LATERAL</text>

  <!-- Minifix Cam Lock (Tambor) -->
  <circle cx="130" cy="150" r="38" fill="url(#metalCam)" stroke="#334155" stroke-width="2.5"/>
  <circle cx="130" cy="150" r="28" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Cross Slot (Ranura Pozidriv / Phillips) -->
  <rect x="126" y="132" width="8" height="36" rx="2" fill="#e2e8f0"/>
  <rect x="112" y="146" width="36" height="8" rx="2" fill="#e2e8f0"/>

  <!-- Alignment Arrow on Cam -->
  <polygon points="130,116 136,126 124,126" fill="#ef4444"/>

  <!-- Connecting Bolt (Perno Minifix) -->
  <g transform="translate(190, 140)">
    <!-- Threaded base -->
    <rect x="70" y="4" width="40" height="12" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <!-- Shaft -->
    <rect x="25" y="6" width="45" height="8" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Head in socket -->
    <circle cx="15" cy="10" r="8" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
  </g>

  <!-- 180° Turn Indicator -->
  <path d="M 80 150 A 50 50 0 0 1 180 150" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="175,142 188,150 175,158" fill="#0284c7"/>
  <text x="130" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">GIRO 180°</text>

  <!-- Badge -->
  <rect x="20" y="20" width="130" height="24" rx="12" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1"/>
  <text x="85" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">MINIFIX 15 MM</text>

  <text x="200" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Ensamble Perno y Tambor Minifix</text>
</svg>
