[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/draco3d/*.wasm"]
  excluded_files = [
    "storage/**",
    "Definiciones/**",
    "graphify-out/**",
    "worker/**"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
