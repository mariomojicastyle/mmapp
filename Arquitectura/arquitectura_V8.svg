    <!-- 1. Next.js Plataforma B2B & Marketing Hub (Top-Left) -->
    <rect x="50" y="160" width="340" height="225" class="box-frontend" />
    <text x="70" y="190" class="box-title-frontend">Plataforma B2B / Marketing Hub (Next.js)</text>
    <text x="70" y="215" class="text">🚀 Módulo de Mercadeo (Planificador 24H + Heatmap)</text>
    <text x="70" y="235" class="text">🌎 Selector de Zonas Horarias (Bento/BRT vs Colombia)</text>
    <text x="70" y="255" class="text">POST /api/marketing/publish (Graph API v19.0 Engine)</text>
