    <text x="70" y="295" class="text">🎨 Canvas HD 2K (2048px @ 98% JPEG) Generator</text>
    <text x="70" y="315" class="text">🔐 Cifrado IP Shield V2 (AES-256-GCM 4KB Header)</text>
    <text x="70" y="335" class="text">API /api/metrics/collect &amp; /api/assets/sign</text>
    <text x="70" y="365" class="text-dim">Netlify App • Puerto 3003 • Mario Mojica Marketing App ID</text>

    <!-- 2. Visor 3D / App Armado (Top-Center) -->
    <rect x="420" y="160" width="310" height="225" class="box-frontend" />
    <text x="440" y="190" class="box-title-frontend">Visor 3D / App Armado (Vite + R3F)</text>
    <text x="440" y="215" class="text">Three.js (@react-three/fiber)</text>
    <text x="440" y="235" class="text">Hook useTelemetry (Despacha POST a Next.js)</text>
    <text x="440" y="255" class="text">🔐 Descifrado AES-256 en RAM (Web Crypto API)</text>
    <text x="440" y="275" class="text">URL Efímera blob:https://... (IP Shield V2)</text>
    <text x="440" y="295" class="text">📱 AR Google Scene Viewer (Edge Function HMAC)</text>
    <text x="440" y="315" class="text">Modo Fricción &amp; Diagnóstico Coordenadas 3D</text>
    <text x="440" y="365" class="text-dim">Netlify CDN • Puerto 5173 • WebGL 2.0 Engine</text>

    <!-- 3. Meta API Graph Publisher (Top-Right) -->
    <rect x="760" y="160" width="340" height="225" class="box-marketing" />
    <text x="780" y="190" class="box-title-marketing">Meta Graph API v19.0 (Facebook &amp; IG)</text>
    <text x="780" y="215" class="text">🔵 Facebook Page: 1219474691249252</text>
    <text x="780" y="235" class="text">  └─ POST /v19.0/{page_id}/photos (Single/Carousel)</text>
    <text x="780" y="255" class="text">📸 Instagram Business: @mariomojicaff</text>
    <text x="780" y="275" class="text">  ├─ POST /v19.0/{ig_id}/media (Container)</text>
    <text x="780" y="295" class="text">  └─ POST /v19.0/{ig_id}/media_publish (+3.5s CDN Delay)</text>
    <text x="780" y="320" class="text">Permisos: instagram_basic, instagram_content_publish</text>
    <text x="780" y="365" class="text-dim">App ID: 1736322840851405 • Token Perenne de Página</text>

    <!-- CENTER LAYER: SUPABASE CLOUD & STORAGE & EDGE FUNCTIONS -->

    <!-- 4. Supabase Cloud Backend (Center) -->
    <rect x="250" y="415" width="650" height="195" class="box-core" />
    <text x="270" y="445" class="box-title-core">Supabase Cloud Backend (Postgres + Storage + Edge Functions)</text>
    <text x="270" y="475" class="text">🗄️ Tablas SQL: marketing_posts, marketing_cuentas, proyectos, telemetria_friccion</text>
    <text x="270" y="500" class="text">🪣 Bucket Privado insumos_manuales: Modelos GLB cifrados AES-256 (Inservibles)</text>
    <text x="270" y="525" class="text">🖼️ Bucket Público marketing-media: Base64 Canvas HD enrutados a HTTPS para Meta CDN</text>
    <text x="270" y="550" class="text">⚡ Edge Function decrypt-glb: Token HMAC-SHA256 (TTL 30m) para AR Scene Viewer</text>
    <text x="270" y="585" class="text-dim">Host Supabase Cloud • Admin Client getSupabaseAdmin() • Auto Backup</text>


    <!-- BOTTOM LAYER: VPS HETZNER, N8N, CRM & LANDING -->

    <!-- 5. VPS Hetzner (Bottom-Left & Center) -->
