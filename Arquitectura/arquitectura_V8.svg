    <text x="235" y="715" class="inner-title">Nginx Proxy Manager</text>
    <text x="235" y="733" class="text-dim">SSL Let's Encrypt / Reverse Proxy Host</text>
    
    <!-- Umami Analytics -->
    <rect x="480" y="695" width="250" height="50" class="inner-app" />
    <text x="495" y="715" class="inner-title">Umami Analytics</text>
    <text x="495" y="733" class="text-dim">analytics.mariomojica.com (Pixel Tracking)</text>
    
    <!-- n8n Automation Engine -->
    <rect x="220" y="765" width="240" height="60" class="inner-app" />
    <text x="235" y="785" class="inner-title">n8n Automation Engine</text>
    <text x="235" y="805" class="text-dim">Webhook Leads + Marketing Cron Worker</text>
    
    <!-- Baserow B2B CRM -->
    <rect x="480" y="765" width="250" height="60" class="inner-app" />
    <text x="495" y="785" class="inner-title">Baserow B2B CRM</text>
    <text x="495" y="805" class="text-dim">Directorio RTA Brasil (Tier 1/2) + Leads</text>

    <text x="220" y="855" class="text-dim">Ubuntu VPS • Docker Bridge internal_network • Backup Semanal • Disk Clean (56%)</text>

    <!-- 6. Rhino Compute Standalone (Bottom-Left) -->
    <rect x="50" y="640" width="130" height="235" class="box-rhino" />
    <text x="60" y="670" class="box-title-rhino">Rhino Compute</text>
    <text x="60" y="700" class="text">Grasshopper</text>
    <text x="60" y="720" class="text">API 8081</text>
    <text x="60" y="750" class="text-dim">Generación</text>
    <text x="60" y="770" class="text-dim">Paramétrica 3D</text>

    <!-- 7. Landing Page / Portafolio (Bottom-Right) -->
