    <text x="800" y="670" class="box-title-frontend">Landing Page / Portafolio (Next.js)</text>
    <text x="800" y="700" class="text">🌐 mariomojica.com (Netlify CDN)</text>
    <text x="800" y="725" class="text">📥 Formulario de Captura de Leads B2B</text>
    <text x="800" y="750" class="text">⚡ Alertas WhatsApp Alertas Cloud API</text>
    <text x="800" y="775" class="text">📲 Integración Demo Manual 3D Móvil</text>
    <text x="800" y="805" class="text-dim">App ID WhatsApp Leads: 789877134189531</text>

    <!-- CONNECTIONS & DATAFLOWS -->
    
    <!-- Next.js Marketing Hub to Meta Graph API -->
    <path d="M 390,265 L 760,265" class="line-marketing" marker-end="url(#arrowhead-mkt)" />
    <text x="575" y="255" text-anchor="middle" class="text-marketing">Publicar Post (Photo / Carousel + Caption)</text>

    <!-- Next.js Marketing Hub to Supabase Storage marketing-media -->
    <path d="M 220,385 L 220,415" class="line-flow" marker-end="url(#arrowhead-flow)" />
    <text x="110" y="400" class="text-label">ensurePublicImageUrl()</text>

    <!-- Meta Graph API pulling image from Supabase Storage marketing-media -->
    <path d="M 930,385 L 930,415" class="line-marketing" marker-end="url(#arrowhead-mkt)" />
    <text x="940" y="400" class="text-marketing">Fetch Image via HTTPS URL</text>

    <!-- Visor 3D to Next.js API -->
    <path d="M 420,215 L 390,215" class="line-flow" marker-end="url(#arrowhead-flow)" />

    <!-- Landing Page to n8n Webhook -->
    <path d="M 940,640 L 940,620 L 340,620 L 340,765" class="line-sec" marker-end="url(#arrowhead-sec)" />
    <text x="640" y="615" text-anchor="middle" class="text-label" fill="#8b5cf6">Webhook Captura Lead &amp; Alerta WhatsApp</text>

    <!-- n8n to Baserow CRM -->
    <path d="M 460,795 L 480,795" class="line-sec" marker-end="url(#arrowhead-sec)" />

</svg>
