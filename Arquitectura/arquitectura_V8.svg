<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 840" width="100%" height="100%">
    <style>
        .background { fill: #0b0f19; }
        .box-core { fill: #111827; stroke: #00f2fe; stroke-width: 2.5; rx: 12; filter: drop-shadow(0px 0px 8px rgba(0, 242, 254, 0.25)); }
        .box-vps { fill: #111827; stroke: #8b5cf6; stroke-width: 2.5; rx: 12; filter: drop-shadow(0px 0px 8px rgba(139, 92, 246, 0.25)); }
        .box-frontend { fill: #111827; stroke: #14b8a6; stroke-width: 2.5; rx: 12; filter: drop-shadow(0px 0px 8px rgba(20, 184, 166, 0.25)); }
        .box-marketing { fill: #111827; stroke: #ec4899; stroke-width: 2.5; rx: 12; filter: drop-shadow(0px 0px 8px rgba(236, 72, 153, 0.25)); }
        .box-rhino { fill: #111827; stroke: #f59e0b; stroke-width: 2; rx: 12; }
        .inner-app { fill: #1f2937; stroke: #4b5563; stroke-width: 1; rx: 6; }
        
        .title { fill: #00f2fe; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.5px; }
        .subtitle { fill: #9ca3af; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 400; }
        .box-title-core { fill: #00f2fe; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: 700; }
        .box-title-vps { fill: #a78bfa; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: 700; }
        .box-title-frontend { fill: #2dd4bf; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: 700; }
        .box-title-marketing { fill: #f472b6; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: 700; }
        .box-title-rhino { fill: #fbbf24; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; }
        .inner-title { fill: #ffffff; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
        .text { fill: #e5e7eb; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; }
        .text-dim { fill: #9ca3af; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 11px; }
        .text-label { fill: #38bdf8; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
        .text-marketing { fill: #f472b6; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
        
        .line-flow { stroke: #06b6d4; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
        .line-sec { stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
        .line-marketing { stroke: #ec4899; stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
        .line-static { stroke: #374151; stroke-width: 1.5; fill: none; }
        .arrow-flow { fill: #06b6d4; }
        .arrow-sec { fill: #8b5cf6; }
        .arrow-mkt { fill: #ec4899; }
    </style>
    <defs>
        <marker id="arrowhead-flow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="arrow-flow" />
        </marker>
        <marker id="arrowhead-sec" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="arrow-sec" />
        </marker>
        <marker id="arrowhead-mkt" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="arrow-mkt" />
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" class="background" />
    
    <!-- Header Title -->
    <text x="575" y="42" text-anchor="middle" class="title">Ecosistema B2B Mario Mojica</text>
    <text x="575" y="66" text-anchor="middle" class="subtitle">Arquitectura V8 (Plataforma B2B, Motor de Mercadeo Multicanal Meta, CRM y Hetzner VPS)</text>

    <!-- TOP LAYER: PLATAFORMA B2B & MARKETING ENGINE -->
    
    <!-- 1. Next.js Plataforma B2B & Marketing Hub (Top-Left) -->
    <rect x="50" y="95" width="340" height="210" class="box-frontend" />
    <text x="70" y="125" class="box-title-frontend">Plataforma B2B / Marketing Hub (Next.js)</text>
    <text x="70" y="150" class="text">🚀 Módulo de Mercadeo (Planificador 24H + Heatmap)</text>
    <text x="70" y="170" class="text">🌎 Selector de Zonas Horarias (Bento/BRT vs Colombia)</text>
    <text x="70" y="190" class="text">POST /api/marketing/publish (Graph API v19.0 Engine)</text>
    <text x="70" y="210" class="text">🔑 Token Exchange Auto: Never-Expiring Page Access</text>
    <text x="70" y="230" class="text">🎨 Canvas HD 2K (2048px @ 98% JPEG) Generator</text>
    <text x="70" y="250" class="text">API /api/metrics/collect &amp; /api/assets/sign (IP Shield)</text>
    <text x="70" y="280" class="text-dim">Netlify App • Puerto 3003 • Mario Mojica Marketing App ID</text>

    <!-- 2. Visor 3D / App Armado (Top-Center) -->
    <rect x="420" y="95" width="310" height="210" class="box-frontend" />
    <text x="440" y="125" class="box-title-frontend">Visor 3D / App Armado (Vite + R3F)</text>
    <text x="440" y="150" class="text">Three.js (@react-three/fiber)</text>
    <text x="440" y="170" class="text">Hook useTelemetry (Despacha POST a Next.js)</text>
    <text x="440" y="190" class="text">Cache urlsFirmadasCache (IP Shield 3D Security)</text>
    <text x="440" y="210" class="text">Animación Sequencial GLB + Audio Sync</text>
    <text x="440" y="230" class="text">Modo Fricción &amp; Diagnóstico de Coordenadas 3D</text>
    <text x="440" y="280" class="text-dim">Netlify CDN • Puerto 5173 • WebGL 2.0 Engine</text>

    <!-- 3. Meta API Graph Publisher (Top-Right) -->
    <rect x="760" y="95" width="340" height="210" class="box-marketing" />
    <text x="780" y="125" class="box-title-marketing">Meta Graph API v19.0 (Facebook &amp; IG)</text>
    <text x="780" y="150" class="text">🔵 Facebook Page: 1219474691249252</text>
    <text x="780" y="170" class="text">  └─ POST /v19.0/{page_id}/photos (Single/Carousel)</text>
    <text x="780" y="190" class="text">📸 Instagram Business: @mariomojicaff</text>
    <text x="780" y="210" class="text">  ├─ POST /v19.0/{ig_id}/media (Container)</text>
    <text x="780" y="230" class="text">  └─ POST /v19.0/{ig_id}/media_publish (+3.5s CDN Delay)</text>
    <text x="780" y="255" class="text">Permisos: instagram_basic, instagram_content_publish</text>
    <text x="780" y="280" class="text-dim">App ID: 1736322840851405 • Token Perenne de Página</text>

    <!-- CENTER LAYER: SUPABASE CLOUD & STORAGE -->

    <!-- 4. Supabase Cloud Backend (Center) -->
    <rect x="250" y="345" width="650" height="180" class="box-core" />
    <text x="270" y="375" class="box-title-core">Supabase Cloud Backend (Postgres + Storage)</text>
    <text x="270" y="405" class="text">🗄️ Tablas SQL: marketing_posts, marketing_cuentas, proyectos, telemetria_friccion</text>
    <text x="270" y="430" class="text">🪣 Bucket Privado insumos_manuales: Archivos .glb, audios y texturas con firmado URL</text>
    <text x="270" y="455" class="text">🖼️ Bucket Público marketing-media: Base64 Canvas HD enrutados a HTTPS para Meta CDN</text>
    <text x="270" y="480" class="text">🔑 Auth Service &amp; Row Level Security (RLS) en Postgres 15</text>
    <text x="270" y="505" class="text-dim">Host Supabase Cloud • Admin Client getSupabaseAdmin() • Auto Backup</text>


    <!-- BOTTOM LAYER: VPS HETZNER, N8N, CRM & LANDING -->

    <!-- 5. VPS Hetzner (Bottom-Left & Center) -->
    <rect x="200" y="565" width="550" height="230" class="box-vps" />
    <text x="220" y="595" class="box-title-vps">VPS Hetzner (Dockerized Stack B2B)</text>
    
    <!-- Nginx Proxy Manager -->
    <rect x="220" y="620" width="240" height="50" class="inner-app" />
    <text x="235" y="640" class="inner-title">Nginx Proxy Manager</text>
    <text x="235" y="658" class="text-dim">SSL Let's Encrypt / Reverse Proxy Host</text>
    
    <!-- Umami Analytics -->
    <rect x="480" y="620" width="250" height="50" class="inner-app" />
    <text x="495" y="640" class="inner-title">Umami Analytics</text>
    <text x="495" y="658" class="text-dim">analytics.mariomojica.com (Pixel Tracking)</text>
    
    <!-- n8n Automation Engine -->
    <rect x="220" y="690" width="240" height="60" class="inner-app" />
    <text x="235" y="710" class="inner-title">n8n Automation Engine</text>
    <text x="235" y="730" class="text-dim">Webhook Leads + Marketing Cron Worker</text>
    
    <!-- Baserow B2B CRM -->
    <rect x="480" y="690" width="250" height="60" class="inner-app" />
    <text x="495" y="710" class="inner-title">Baserow B2B CRM</text>
    <text x="495" y="730" class="text-dim">Directorio RTA Brasil (Tier 1/2) + Leads</text>

    <text x="220" y="780" class="text-dim">Ubuntu VPS • Docker Bridge internal_network • Backup Semanal • Disk Clean (56%)</text>

    <!-- 6. Rhino Compute Standalone (Bottom-Left) -->
    <rect x="50" y="565" width="130" height="230" class="box-rhino" />
    <text x="60" y="595" class="box-title-rhino">Rhino Compute</text>
    <text x="60" y="625" class="text">Grasshopper</text>
    <text x="60" y="645" class="text">API 8081</text>
    <text x="60" y="675" class="text-dim">Generación</text>
    <text x="60" y="695" class="text-dim">Paramétrica 3D</text>

    <!-- 7. Landing Page / Portafolio (Bottom-Right) -->
    <rect x="780" y="565" width="320" height="230" class="box-frontend" />
    <text x="800" y="595" class="box-title-frontend">Landing Page / Portafolio (Next.js)</text>
    <text x="800" y="625" class="text">🌐 mariomojica.com (Netlify CDN)</text>
    <text x="800" y="650" class="text">📥 Formulario de Captura de Leads B2B</text>
    <text x="800" y="675" class="text">⚡ Alertas WhatsApp Alertas Cloud API</text>
    <text x="800" y="700" class="text">📲 Integración Demo Manual 3D Móvil</text>
    <text x="800" y="730" class="text-dim">App ID WhatsApp Leads: 789877134189531</text>

    <!-- CONNECTIONS & DATAFLOWS -->
    
    <!-- Next.js Marketing Hub to Meta Graph API -->
    <path d="M 390,200 L 760,200" class="line-marketing" marker-end="url(#arrowhead-mkt)" />
    <text x="575" y="190" text-anchor="middle" class="text-marketing">Publicar Post (Photo / Carousel + Caption)</text>

    <!-- Next.js Marketing Hub to Supabase Storage marketing-media -->
    <path d="M 220,305 L 220,345" class="line-flow" marker-end="url(#arrowhead-flow)" />
    <text x="110" y="330" class="text-label">ensurePublicImageUrl()</text>

    <!-- Meta Graph API pulling image from Supabase Storage marketing-media -->
    <path d="M 930,305 L 930,345" class="line-marketing" marker-end="url(#arrowhead-mkt)" />
    <text x="940" y="330" class="text-marketing">Fetch Image via HTTPS URL</text>

    <!-- Visor 3D to Next.js API -->
    <path d="M 420,150 L 390,150" class="line-flow" marker-end="url(#arrowhead-flow)" />

    <!-- Landing Page to n8n Webhook -->
    <path d="M 940,565 L 940,545 L 340,545 L 340,690" class="line-sec" marker-end="url(#arrowhead-sec)" />
    <text x="640" y="540" text-anchor="middle" class="text-label" fill="#8b5cf6">Webhook Captura Lead &amp; Alerta WhatsApp</text>

    <!-- n8n to Baserow CRM -->
    <path d="M 460,720 L 480,720" class="line-sec" marker-end="url(#arrowhead-sec)" />

</svg>
