<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadowDesk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="20" fill="#1E232A" />
  <circle cx="120" cy="120" r="105" fill="#15191E" stroke="#2D333B" stroke-width="1.5" />
  <ellipse cx="120" cy="190" rx="75" ry="16" fill="#0D1013" opacity="0.7" />
  <!-- Escritorio 3D -->
  <g transform="translate(120, 115) scale(0.9)" filter="url(#shadowDesk)">
    <!-- Tapa Superior -->
    <polygon points="-65,-25 15,-55 75,-20 -5,10" fill="url(#deskGrad)" stroke="#FDE68A" stroke-width="1"/>
    <!-- Patas Izquierda y Derecha -->
    <polygon points="-65,-25 -55,-21 -55,45 -65,40" fill="#78350F"/>
    <polygon points="-15,5 -5,10 -5,65 -15,60" fill="#92400E"/>
    <polygon points="65,-23 75,-20 75,40 65,36" fill="#78350F"/>
  </g>
</svg>
